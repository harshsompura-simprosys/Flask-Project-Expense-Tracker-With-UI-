
{% extends "layout.html" %}
{% block body %}




<div class="update-card">
    <h3>Update Expense</h3>
    <form action="{{ url_for('exp.update_expense', id=expense['_id']) }}" method="POST">
        
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" value="{{ expense['title'] }}" placeholder="e.g. Electricity Bill">
        </div>

        <div class="form-group">
            <label>Amount ($)</label>
            <input type="number" step="0.01" name="amount" value="{{ expense['amount'] }}">
        </div>

        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ expense['date'] }}">
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text" name="category" value="{{ expense['category'] }}" placeholder="e.g. Utilities">
        </div>

        <button type="submit" class="btn-update">Update Expense</button>
    </form>
</div>
{% endblock %}
