<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg-body: #f8fafc;
        --bg-card: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --success: #10b981;
        --border: #e2e8f0;
    }

    body {
        background-color: var(--bg-body);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-main);
        margin: 0;
    }

    /* Modern Navigation */
    .navbar {
        width: 100%;
        height: 70px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .nav-list {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        height: 100%;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .nav-link {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
    }

    .nav-link:hover {
        color: var(--primary);
    }

    /* Main Container */
    .main-wrapper {
        max-width: 1200px; /* Slightly wider for the full-width buttons */
        margin: 40px auto;
        padding: 0 20px;
    }

    .table-container {
        background: var(--bg-card);
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        border: 1px solid var(--border);
    }

    .header-section {
        padding: 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    h2 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
    }

    /* Table Styling */
    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }

    th {
        background-color: #f1f5f9;
        padding: 16px 20px;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
    }

    td {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
    }

    tr:last-child td {
        border-bottom: none;
    }

    /* UI Components */
    .badge {
        background: #eef2ff;
        color: var(--primary);
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        display: inline-block;
    }

    .amount-cell {
        font-weight: 600;
        color: var(--text-main);
    }

    /* Action Buttons - NEW FIXED STYLING */
    .actions-cell {
        display: flex; /* Key to fixing the alignment */
        gap: 8px; /* Space between Edit/Delete */
        justify-content: flex-end; /* Align them to the right of the cell */
    }

    .btn {
        padding: 8px 12px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s;
        text-align: center;
        flex: 1; /* Key to letting them share/take the width */
        max-width: 100px; /* Optional: keep them from getting too wide if not necessary */
    }

    .btn-update {
        background-color: var(--primary);
        color: white;
        border: 1px solid var(--primary);
    }

    .btn-update:hover {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
    }

    .btn-delete {
        color: var(--danger);
        padding: 12px;
        background: transparent;
        border: 1px solid #fee2e2; /* Light border for definition */
    }

    .btn-delete:hover {
        background: #fee2e2;
        color: var(--danger-hover);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .actions-cell {
            flex-direction: column;
            gap: 4px;
        }
        .btn {
            max-width: none;
            width: 100%;
        }
    }

    .update-card {
        max-width: 450px;
        margin:200px auto;
        padding: 25px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .update-card h3 {
        margin-top: 0;
        margin-bottom: 20px;
        color: #2c3e50;
        font-size: 1.2rem;
        border-bottom: 2px solid #f0f2f5;
        padding-bottom: 10px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 6px;
        text-transform: uppercase;
    }

    .form-group input {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        color: #334155;
        box-sizing: border-box; /* Ensures padding doesn't break width */
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn-update {
        width: 100%;
        background-color: #3b82f6;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 10px;
    }

    .btn-update:hover {
        background-color: #2563eb;
    }
    </style>
</head>
<body>
    {% block body %} {% endblock %}
</body>
</html>
